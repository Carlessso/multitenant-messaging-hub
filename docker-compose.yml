services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hubnode
      POSTGRES_PASSWORD: hubnode
      POSTGRES_DB: hubnode
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubnode -d hubnode']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
